name: Auto-close duplicate issues
# orca-mcp: inherited from upstream OrcaSlicer. Every job below is gated on
# github.repository so this issue/PR automation stays inert on the fork - it
# speaks with the upstream project's voice (labels, bot comments, auto-close)
# and targets whichever repo it runs in. Guarding rather than deleting keeps
# the file mergeable with upstream, and matches upstream's own idiom (18 uses
# across build_all.yml, build_orca.yml, doxygen-docs.yml, pr-merge-bot.yml).
description: Auto-closes issues that are duplicates of existing issues
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  auto-close-duplicates:
    if: github.repository == 'OrcaSlicer/OrcaSlicer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Auto-close duplicate issues
        run: bun run scripts/auto-close-duplicates.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          STATSIG_API_KEY: ${{ secrets.STATSIG_API_KEY }}
