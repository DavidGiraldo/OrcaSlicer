name: Backfill Duplicate Comments
# orca-mcp: inherited from upstream OrcaSlicer. Every job below is gated on
# github.repository so this issue/PR automation stays inert on the fork - it
# speaks with the upstream project's voice (labels, bot comments, auto-close)
# and targets whichever repo it runs in. Guarding rather than deleting keeps
# the file mergeable with upstream, and matches upstream's own idiom (18 uses
# across build_all.yml, build_orca.yml, doxygen-docs.yml, pr-merge-bot.yml).
description: Triggers duplicate detection for old issues that don't have duplicate comments

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: 'How many days back to look for old issues'
        required: false
        default: '90'
        type: string
      dry_run:
        description: 'Dry run mode (true to only log what would be done)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  backfill-duplicate-comments:
    if: github.repository == 'OrcaSlicer/OrcaSlicer'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Backfill duplicate comments
        run: bun run scripts/backfill-duplicate-comments.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS_BACK: ${{ inputs.days_back }}
          DRY_RUN: ${{ inputs.dry_run }}