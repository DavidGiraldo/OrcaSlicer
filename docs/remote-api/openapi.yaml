openapi: 3.0.3
info:
  title: OrcaSlicer Remote API
  version: "1.0"
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  description: |
    Token-authenticated HTTP + WebSocket API embedded in OrcaSlicer, exposing the
    running application for automation: status, live config read/write, model
    loading, object manipulation, preset management, slicing, plate rendering and
    an event stream.

    **Enabling:** Preferences → *Remote API*: enable, choose LAN vs localhost,
    port (default 13130), and copy/regenerate the token. Off by default.

    **Auth:** every HTTP request must send `X-Api-Token: <token>` (a bare value,
    not a `Bearer` scheme). No route is exempt: authentication runs before
    routing, so an unknown path without a valid token returns 401, not 404. The
    WebSocket authenticates via a `?token=<token>` query parameter, because
    browser WS clients cannot set request headers.

    **Threading:** the server runs a single I/O thread and dispatches most
    endpoints onto the GUI thread with a 10s timeout (`504 ui_timeout`).
    `POST /model`, `POST /project/save` and `POST /project/open` allow 120s,
    `POST /project/new` 60s and `GET /plate/render` 30s. A timed-out request is
    cancelled before it runs, so it does not apply its effects afterwards. Treat
    the API as single-client; concurrent heavy calls serialize.

    **Limits:** request bodies are capped at 4 MiB; sockets time out after 15s of
    inactivity; connections are not kept alive.

    See docs/HLSD/remote-api.md for the design, and docs/remote-api/README.md for
    the annotated reference.
servers:
  - url: http://{host}:{port}/api/v1
    variables:
      host: { default: "127.0.0.1", description: "localhost, or the machine's LAN IP when 'Bind LAN' is on" }
      port: { default: "13130" }
security:
  - ApiToken: []

tags:
  - name: status
    description: What the application and the current project are doing.
  - name: config
    description: Reading and writing slicer settings.
  - name: slice
    description: Starting, following and cancelling a slice, and fetching its G-code.
  - name: model
    description: Loading model files from the host filesystem.
  - name: presets
    description: Listing, selecting, saving, reading and deleting presets.
  - name: objects
    description: Inspecting and manipulating the objects on the plate.
  - name: jobs
    description: Arrange and orient, which run on the UI job worker.
  - name: render
    description: Offscreen PNG renders of the plate and the toolpaths.
  - name: plates
    description: Listing, selecting, adding, deleting and configuring plates.
  - name: project
    description: Saving, opening and starting projects.
  - name: events
    description: The WebSocket push stream.

paths:
  /status:
    get:
      tags: [status]
      summary: Application + project status
      operationId: getStatus
      responses:
        "200":
          description: Current app, project, loaded objects, selected/modified presets, and slice validity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /config:
    get:
      tags: [config]
      summary: Read configuration values
      operationId: getConfig
      description: |
        Values are always strings, in the canonical serialized form used by .ini
        and .3mf. Keys that do not exist are omitted rather than reported.

        `keys` must be the first and only query parameter: the handler takes
        everything after `?keys=` to the end of the target.
      parameters:
        - name: keys
          in: query
          required: false
          description: Comma-separated config keys. Omit for the full config.
          schema: { type: string }
          example: layer_height,wall_loops
      responses:
        "200":
          description: The requested keys.
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config:
                    type: object
                    additionalProperties: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [config]
      summary: Write configuration values (atomic)
      operationId: putConfig
      description: |
        A flat object of key to value. Values may be strings, booleans, integers
        or floats; booleans become "1" and "0". Keys are routed to the first
        config that accepts them, in the order print, filament, printer, then the
        project config.

        The write is atomic: if any key fails validation nothing is applied.

        Project-scope keys are governed by a default-deny allow-list. Only
        flush_volumes_matrix, flush_multiplier, flush_multiplier_fast,
        filament_colour, curr_bed_type, prime_volume_mode, wipe_tower_x and
        wipe_tower_y are writable, each with its own invariant. wipe_tower_x and
        wipe_tower_y take a single number written into the per-plate vector at
        the current plate index, not a whole-vector replacement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                oneOf:
                  - { type: string }
                  - { type: boolean }
                  - { type: number }
              example: { layer_height: 0.24, wall_loops: 3 }
      responses:
        "200":
          description: Every key applied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigWriteResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: |
            Validation failed; nothing was applied. `errors` maps each failing key
            to a reason, such as `unknown_key`,
            `not_editable_in_current_config`, `key_dropped_by_legacy_handler`,
            `unsupported value type`,
            `expected at least one value, got an empty list`, a project-scope
            block reason like `not_writable_project_key`, or the text thrown by
            the strict deserializer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigWriteResult" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /slice:
    post:
      tags: [slice]
      summary: Start slicing the current plate, or plate N
      operationId: startSlice
      parameters:
        - $ref: "#/components/parameters/PlateQuery"
      responses:
        "200":
          description: The plate already holds a valid slice result; nothing started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean, enum: [false] }
                  already_valid: { type: boolean, enum: [true] }
                  plate: { type: integer }
        "202":
          description: Slicing started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean, enum: [true] }
                  plate: { type: integer }
        "400": { $ref: "#/components/responses/BadPlateParam" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownPlate" }
        "409":
          description: "`already_slicing`, or `busy_slicing` when switching to plate N."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: |
            `nothing_to_slice` when the model holds no objects, or
            `slice_not_started` when the plate cannot be sliced. The latter
            carries why, found the way the Slice button finds it.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/SliceNotStarted"
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /slice/status:
    get:
      tags: [slice]
      summary: Slice state, progress, statistics and warnings
      operationId: getSliceStatus
      description: |
        Reads a mutex-guarded snapshot without touching the GUI thread, so this
        endpoint never returns 504.
      responses:
        "200":
          description: Current slice snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SliceStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /slice/cancel:
    post:
      tags: [slice]
      summary: Cancel a running slice
      operationId: cancelSlice
      responses:
        "200":
          description: "`cancelled` reports whether a slice was actually running."
          content:
            application/json:
              schema:
                type: object
                required: [cancelled]
                properties:
                  cancelled: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /model:
    post:
      tags: [model]
      summary: Load a model file from the host filesystem
      operationId: loadModel
      description: |
        The path is resolved on the machine running OrcaSlicer. Any configuration
        embedded in a .3mf is ignored (LoadModel only).

        Allows 120 seconds instead of the usual 10, because reading and
        tessellating a real STEP file legitimately takes longer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Host path ending in .stl, .obj, .3mf, .step or .stp.
                  example: "C:/models/part.stl"
      responses:
        "200":
          description: Loaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  loaded: { type: boolean }
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        name: { type: string }
                        size_mm: { $ref: "#/components/schemas/Vec3" }
        "400":
          description: "`invalid_json`, or `missing_path` when the body has no string `path`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`not_found` — the path does not exist."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`unsupported_format` or `load_failed`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /presets:
    get:
      tags: [presets]
      summary: List presets by type
      operationId: getPresets
      description: Default presets are omitted.
      responses:
        "200":
          description: Presets grouped by type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  print:    { type: array, items: { $ref: "#/components/schemas/PresetListItem" } }
                  filament: { type: array, items: { $ref: "#/components/schemas/PresetListItem" } }
                  printer:  { type: array, items: { $ref: "#/components/schemas/PresetListItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /preset:
    put:
      tags: [presets]
      summary: Select a preset
      operationId: selectPreset
      description: |
        Unsaved changes in the edited presets are discarded first, so the
        selection cannot block on the modal unsaved-changes dialog.

        A name the preset was renamed from is accepted and resolved; `selected`
        is always the current name. A filament goes into the project filament
        slot `slot` (1-based, default 1), which is what slicing uses, and
        becomes the edited preset that PUT /config and POST /preset/save act
        on. A printer
        that exists but is not installed is made visible for the session and
        selected; a hidden print or filament preset is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresetSelect" }
      responses:
        "200":
          description: Selected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  selected: { type: string }
                  slot:
                    type: integer
                    description: Filament only - the slot that was assigned.
        "400":
          description: "`invalid_json`, `missing_fields`, `unknown_type` or `bad_param` (`slot`)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            `selection_fell_back` - the slicer selected a different preset, named
            in `selected`.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: |
            `unknown_preset`, `preset_not_installed` (a hidden print or filament
            preset) or `bad_slot` (past the project's `slots`).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500":
          description: "`tab_unavailable` or `select_cancelled`, plus the generic `internal`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      tags: [presets]
      summary: Delete a user preset
      operationId: deletePreset
      description: Takes a request body, which some HTTP clients disallow on DELETE.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresetRef" }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
        "400":
          description: "`invalid_json`, `missing_fields` or `unknown_type`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`unknown_preset`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: |
            `builtin_preset`, `preset_selected` (select another preset first) or
            `has_children` (other presets inherit from this one).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500":
          description: "`delete_failed`, plus the generic `internal`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /preset/save:
    post:
      tags: [presets]
      summary: Save the edited preset under a name
      operationId: savePreset
      description: |
        The name is trimmed, must be at most 128 characters, and may not be
        empty, "." or "..", contain any of `<>[]:/\|?*"`, or contain a control
        character.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PresetRef"
                - type: object
                  properties:
                    detach: { type: boolean, default: false }
      responses:
        "200":
          description: "`created` reports whether the preset is new."
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:   { type: string }
                  created: { type: boolean }
        "400":
          description: "`invalid_json`, `missing_fields`, `unknown_type` or `invalid_name`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`name_reserved` — the target name is a system or default preset."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500":
          description: "`tab_unavailable` or `save_failed`, plus the generic `internal`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /preset/config:
    post:
      tags: [presets]
      summary: Read a named preset's configuration
      operationId: getPresetConfig
      description: |
        Read-only. A POST rather than a GET so that preset names containing
        spaces or "@" need no URL encoding.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresetRef" }
      responses:
        "200":
          description: The preset's serialized configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:   { type: string }
                  system: { type: boolean }
                  config:
                    type: object
                    additionalProperties: { type: string }
        "400":
          description: "`invalid_json`, `missing_fields` or `unknown_type`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`unknown_preset`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /objects:
    get:
      tags: [objects]
      summary: List objects on the plate
      operationId: getObjects
      responses:
        "200":
          description: |
            `transform` describes instance 0 only, and its `rotation` is in
            radians. `on_plate` means the bounding box sits on the bed within
            0.05 mm.
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects: { type: array, items: { $ref: "#/components/schemas/ObjectSummary" } }
                  count:   { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /objects/{id}:
    delete:
      tags: [objects]
      summary: Remove an object
      operationId: deleteObject
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200":
          description: "`count` is how many objects remain."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
                  id:      { type: integer, format: int64 }
                  count:   { type: integer }
        "400": { $ref: "#/components/responses/BadObjectId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownObject" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /objects/{id}/transform:
    post:
      tags: [objects]
      summary: Move, rotate or scale an instance, or move it to a plate
      operationId: transformObject
      description: |
        At least one of plate, translate, rotate or scale. The vectors must be
        arrays of exactly three numbers or they are treated as absent. Applies to
        `instance`, default 0.

        plate moves the instance to that plate, keeping its position relative to
        the plate (one on no plate is centred on it). translate is then a relative
        delta in mm, rotate a relative delta in degrees, and scale an absolute
        factor that replaces the current one. The echoed rotation is in radians.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                instance:  { type: integer, minimum: 0, default: 0 }
                plate:     { type: integer, minimum: 0, description: Target plate index. }
                translate: { $ref: "#/components/schemas/Vec3" }
                rotate:    { $ref: "#/components/schemas/Vec3" }
                scale:     { $ref: "#/components/schemas/Vec3" }
              example: { translate: [10, 0, 0], rotate: [0, 0, 45] }
      responses:
        "200":
          description: The object's transform after the change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:        { type: integer, format: int64 }
                  instance:  { type: integer }
                  plate:     { type: integer, description: -1 when on no plate. }
                  transform: { $ref: "#/components/schemas/Transform" }
        "400":
          description: |
            `invalid_json`, `body_must_be_object`, `bad_object_id`, `bad_param`
            (instance or plate), or `no_transform` when no field was usable.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`unknown_object`, `no_instance`, `unknown_instance` or `unknown_plate`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /objects/{id}/duplicate:
    post:
      tags: [objects]
      summary: Add an instance
      operationId: duplicateObject
      description: |
        Adds an instance offset by 10 mm in X and Y from instance 0, sharing its
        scale, rotation and mirror, and registers it with the plate it lands on.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      responses:
        "200":
          description: Duplicated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicated: { type: boolean }
                  id:         { type: integer, format: int64 }
                  instances:  { type: integer }
        "400": { $ref: "#/components/responses/BadObjectId" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownObject" }
        "422":
          description: "`no_instance` — the object has no instance to copy."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /objects/{id}/config:
    put:
      tags: [objects]
      summary: Per-object settings (atomic)
      operationId: putObjectConfig
      description: |
        A flat object of per-object settings, validated and applied atomically in
        the same way as PUT /config. Keys must exist in the print config
        definition.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                oneOf:
                  - { type: string }
                  - { type: boolean }
                  - { type: number }
              example: { wall_loops: 4 }
      responses:
        "200":
          description: Every key applied.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ConfigWriteResult"
                  - type: object
                    properties:
                      object: { type: string, description: The object's name. }
        "400":
          description: "`invalid_json`, `body_must_be_object` or `bad_object_id`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownObject" }
        "422":
          description: Validation failed; nothing was applied. `object` is absent on this path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigWriteResult" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /objects/{id}/layer_height:
    put:
      tags: [objects]
      summary: Adaptive layer height, or reset
      operationId: putLayerHeight
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:    { type: string, enum: [adaptive, reset] }
                quality: { type: number, minimum: 0, maximum: 1, default: 0.5 }
      responses:
        "200":
          description: |
            For mode=reset only `id` and `mode` are returned. For mode=adaptive
            the response also carries `quality`, `points`, `layer_height_min` and
            `layer_height_max`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:               { type: integer, format: int64 }
                  mode:             { type: string, enum: [adaptive, reset] }
                  quality:          { type: number }
                  points:           { type: integer }
                  layer_height_min: { type: number }
                  layer_height_max: { type: number }
        "400":
          description: |
            `invalid_json`, `bad_object_id`, `missing_mode`, `unknown_mode` or
            `quality_out_of_range`.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownObject" }
        "422":
          description: "`profile_failed` — the adaptive profile could not be computed."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /objects/{id}/height_range:
    put:
      tags: [objects]
      summary: Per-height-range layer height
      operationId: putHeightRange
      description: |
        Either set a range (min_z, max_z, layer_height) or clear them all
        (clear: true). max_z must exceed min_z, min_z must be at least 0, and
        layer_height must fall within the printer preset's limits. A range
        exactly equal to an existing one updates it rather than colliding.
      parameters:
        - $ref: "#/components/parameters/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [min_z, max_z, layer_height]
                  properties:
                    min_z:        { type: number, minimum: 0 }
                    max_z:        { type: number }
                    layer_height: { type: number }
                - type: object
                  required: [clear]
                  properties:
                    clear: { type: boolean, enum: [true] }
      responses:
        "200":
          description: The full list of ranges after the change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:            { type: integer, format: int64 }
                  height_ranges: { type: array, items: { $ref: "#/components/schemas/HeightRange" } }
        "400":
          description: |
            `invalid_json`, `body_must_be_object`, `bad_object_id`,
            `missing_fields` or `bad_range`.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownObject" }
        "422":
          description: |
            `layer_height_out_of_range`, which carries `min` and `max` rather
            than a `detail`; or `overlaps_existing`, which carries `existing` as
            a two-element array.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:    { type: string, enum: [layer_height_out_of_range, overlaps_existing] }
                  min:      { type: number }
                  max:      { type: number }
                  existing:
                    type: array
                    items: { type: number }
                    minItems: 2
                    maxItems: 2
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /arrange:
    post:
      tags: [jobs]
      summary: Arrange the plate
      operationId: arrangePlate
      description: |
        Progress is shown in the slicer's own UI; poll /jobs/status for completion.
        Without `plate`, acts on everything as the toolbar button does; with it,
        only on that plate, as the plate's own menu does. Arrange skips locked plates.
      parameters:
        - $ref: "#/components/parameters/PlateQuery"
      responses:
        "202": { $ref: "#/components/responses/JobStarted" }
        "400": { $ref: "#/components/responses/BadPlateParam" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownPlate" }
        "409":
          description: "`job_running`, `plate_locked` or `busy_slicing`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/PlateEmpty" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /orient:
    post:
      tags: [jobs]
      summary: Auto-orient objects
      operationId: orientObjects
      description: |
        Progress is shown in the slicer's own UI; poll /jobs/status for completion.
        Without `plate`, acts on everything as the toolbar button does; with it,
        only on that plate, as the plate's own menu does. Arrange skips locked plates.
      parameters:
        - $ref: "#/components/parameters/PlateQuery"
      responses:
        "202": { $ref: "#/components/responses/JobStarted" }
        "400": { $ref: "#/components/responses/BadPlateParam" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownPlate" }
        "409":
          description: "`job_running`, `plate_locked` or `busy_slicing`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422": { $ref: "#/components/responses/PlateEmpty" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /jobs/status:
    get:
      tags: [jobs]
      summary: Whether arrange/orient is idle
      operationId: getJobsStatus
      description: Covers the UI job worker (arrange and orient), not the slicing process.
      responses:
        "200":
          description: Job worker state.
          content:
            application/json:
              schema:
                type: object
                required: [idle]
                properties:
                  idle: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /plate/render:
    get:
      tags: [render]
      summary: PNG of the plate or the toolpaths
      operationId: renderPlate
      description: |
        Returns image/png, not JSON. Errors are still JSON. Allows 30 seconds.
        `plate` makes that plate the current one first.
      parameters:
        - $ref: "#/components/parameters/PlateQuery"
        - name: view
          in: query
          schema: { type: string, enum: [editor, preview], default: editor }
        - name: angle
          in: query
          schema: { type: string, enum: [iso, top, front, left, right, rear, bottom], default: iso }
        - name: frame
          in: query
          description: Defaults to plate for view=editor and object for view=preview.
          schema: { type: string, enum: [plate, object] }
        - name: width
          in: query
          schema: { type: integer, minimum: 64, maximum: 2048, default: 800 }
        - name: height
          in: query
          schema: { type: integer, minimum: 64, maximum: 2048, default: 600 }
      responses:
        "200":
          description: The rendered image.
          content:
            image/png:
              schema: { type: string, format: binary }
        "400":
          description: |
            `bad_param`, naming the offending `param`. Most carry an `allowed`
            array; the width/height case does not.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:   { type: string, enum: [bad_param] }
                  param:   { type: string }
                  allowed: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`no_slice_result` — view=preview without a valid slice."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500":
          description: |
            `render_failed`, carrying a `reason` such as "no preview canvas",
            "gcode preview render unavailable", "editor plate render failed" or
            "png encode failed". Also the generic `internal`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:  { type: string }
                  reason: { type: string }
                  detail: { type: string }

  /gcode:
    get:
      tags: [slice]
      summary: Raw G-code of the current plate's slice, or plate N's
      operationId: getGcode
      description: |
        Returns text/plain, not JSON. Errors are still JSON. With `plate`, reads
        that plate's slice without changing the current plate.
      parameters:
        - $ref: "#/components/parameters/PlateQuery"
      responses:
        "200":
          description: The G-code file's contents.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadPlateParam" }
        "404": { $ref: "#/components/responses/UnknownPlate" }
        "409":
          description: "`not_sliced` — no valid slice result on the plate."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500":
          description: "`gcode_file_missing`, plus the generic `internal`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /plates:
    get:
      tags: [plates]
      summary: List plates
      operationId: listPlates
      responses:
        "200":
          description: Every plate, in index order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:   { type: integer }
                  current: { type: integer }
                  plates:  { type: array, items: { $ref: "#/components/schemas/Plate" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      tags: [plates]
      summary: Add a plate
      operationId: addPlate
      description: Adds a plate after the last one and makes it current, as the toolbar button does.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "201": { $ref: "#/components/responses/PlateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`busy_slicing`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`cannot_add_plate` — the maximum number of plates is reached."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /plates/{index}:
    parameters:
      - $ref: "#/components/parameters/PlateIndex"
    get:
      tags: [plates]
      summary: One plate
      operationId: getPlate
      responses:
        "200": { $ref: "#/components/responses/PlateResult" }
        "400": { $ref: "#/components/responses/BadPlateIndex" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownPlate" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      tags: [plates]
      summary: Rename, lock and configure a plate
      operationId: updatePlate
      description: |
        Any subset of the fields, validated as a whole before anything changes.
        Settings are applied as the Plate Settings dialog applies them; turning
        spiral_mode on also applies the vase-mode object settings the dialog would
        have asked about.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlateUpdate" }
      responses:
        "200": { $ref: "#/components/responses/PlateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownPlate" }
        "422":
          description: "`invalid_settings`, with an `errors` object keyed by field."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:  { type: string, enum: [invalid_settings] }
                  errors: { type: object, additionalProperties: { type: string } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      tags: [plates]
      summary: Delete a plate
      operationId: deletePlate
      description: |
        The slicer moves a deleted plate's objects onto the last plate or off every
        plate; it never deletes them. A plate that still holds objects is refused
        unless `force=true`. Later plates shift down by one index.
      parameters:
        - name: force
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:       { type: integer }
                  moved_objects: { type: array, items: { $ref: "#/components/schemas/PlateObject" } }
                  count:         { type: integer }
                  current:       { type: integer }
        "400": { $ref: "#/components/responses/BadPlateIndex" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownPlate" }
        "409":
          description: |
            `last_plate`, `busy_slicing`, or `plate_not_empty` (listing the
            instances in `objects`) without force.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /plates/{index}/select:
    parameters:
      - $ref: "#/components/parameters/PlateIndex"
    post:
      tags: [plates]
      summary: Make a plate the current one
      operationId: selectPlate
      responses:
        "200": { $ref: "#/components/responses/PlateResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownPlate" }
        "409":
          description: "`busy_slicing`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /plates/{index}/duplicate:
    parameters:
      - $ref: "#/components/parameters/PlateIndex"
    post:
      tags: [plates]
      summary: Duplicate a plate and its objects
      operationId: duplicatePlate
      responses:
        "201": { $ref: "#/components/responses/PlateResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/UnknownPlate" }
        "422":
          description: "`cannot_add_plate`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /project/save:
    post:
      tags: [project]
      summary: Save the project, or save it as a path
      operationId: saveProject
      description: |
        Without a path, saves where the project was opened or last saved; with
        one, saves there and makes it the project's path, as Save As does. The
        path must end in .3mf and its folder must exist. Allows 120 seconds.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                path: { type: string }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`no_project_path` — the project was never saved and no path was given."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`bad_path`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500":
          description: "`save_failed`, plus the generic `internal`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /project/open:
    post:
      tags: [project]
      summary: Open a .3mf project
      operationId: openProject
      description: |
        Opens a project as the File menu does. Unsaved changes are refused with
        409 project_dirty rather than prompted about; pass discard to drop them.
        The warning about custom G-code in the project's presets is not shown.
        Allows 120 seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:    { type: string }
                discard: { type: boolean, default: false }
      responses:
        "200":
          description: Opened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:     { type: string }
                  plate_count: { type: integer }
                  objects:     { type: integer }
        "400":
          description: "`invalid_json`, `body_must_be_object` or `missing_path`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`not_found`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409": { $ref: "#/components/responses/ProjectBlocked" }
        "422":
          description: "`unsupported_format` — only .3mf projects."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /project/new:
    post:
      tags: [project]
      summary: Start a new, empty project
      operationId: newProject
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                discard: { type: boolean, default: false }
      responses:
        "200":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:     { type: boolean, enum: [true] }
                  plate_count: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/ProjectBlocked" }
        "504": { $ref: "#/components/responses/UiTimeout" }
        "500": { $ref: "#/components/responses/Internal" }

  /events:
    get:
      tags: [events]
      summary: WebSocket event stream
      operationId: events
      description: |
        Not a plain HTTP endpoint: connect with a WebSocket upgrade to
        `ws://{host}:{port}/api/v1/events?token=<token>`. The token travels as a
        query parameter because browser WebSocket clients cannot set headers.

        Server to client only; inbound frames are read and discarded. Each frame
        is one JSON object whose discriminator is `event`, not `type`.

        Event values: `project.opened` and `project.saved` (carry `project`),
        `project.new`, `config.changed`
        (carries `tabs`, the coalesced set of print, filament, printer,
        sla_print, sla_material and other, debounced by one event-loop turn), and
        the slice snapshots `slice.started`, `slice.progress`, `slice.done`,
        `slice.error` and `slice.cancelled`.

        A slice snapshot carries `event`, `state`, `percent`, `message`, `plate`
        and, when a slice succeeded, `stats`. It does not carry `warnings`; read those from
        GET /slice/status.

        An upgrade without a valid token falls through to the HTTP path and is
        rejected there with 401.
      responses:
        "200":
          description: |
            Not returned in practice. A successful handshake answers 101 and the
            connection becomes a WebSocket; this entry exists because the OpenAPI
            tooling requires a 2XX response and cannot describe an upgrade.
        "101":
          description: Switching protocols; the WebSocket is open.
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-Api-Token
      description: |
        32 hex characters from OpenSSL's CSPRNG, generated on first use and shown
        in Preferences. A bare value, not a Bearer scheme. Compared in constant
        time. The WebSocket takes the same token as a `?token=` query parameter
        instead.

  parameters:
    ObjectId:
      name: id
      in: path
      required: true
      description: The object's stable id, as reported by GET /objects.
      schema: { type: integer, format: int64 }
    PlateIndex:
      name: index
      in: path
      required: true
      description: The plate's index, from 0, as reported by GET /plates.
      schema: { type: integer, minimum: 0 }
    PlateQuery:
      name: plate
      in: query
      required: false
      description: Act on this plate (index from 0) instead of the current one.
      schema: { type: integer, minimum: 0 }

  responses:
    Unauthorized:
      description: |
        Missing or wrong token. The two are deliberately indistinguishable. No
        route is exempt, so an unknown path without a valid token lands here
        rather than on 404.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unauthorized }
    BadRequest:
      description: "`invalid_json` for a malformed body, or `body_must_be_object`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadObjectId:
      description: "`bad_object_id` — the path segment is not an unsigned integer."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: bad_object_id }
    UnknownObject:
      description: "`unknown_object` — no object carries that id."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unknown_object }
    UiTimeout:
      description: |
        The GUI thread did not run the task within its budget (10s by default,
        120s for POST /model, /project/save and /project/open, 60s for
        /project/new, 30s for GET /plate/render). The task is cancelled
        before it runs, so it does not apply its effects afterwards.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: ui_timeout }
    Internal:
      description: An unhandled failure. `detail` carries the exception text.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: internal, detail: "..." }
    JobStarted:
      description: The job was queued on the UI job worker.
      content:
        application/json:
          schema:
            type: object
            properties:
              started: { type: boolean, enum: [true] }
    JobRunning:
      description: "`job_running` — the UI job worker is busy."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: job_running }
    UnknownPlate:
      description: "`unknown_plate` — no plate has that index; `count` gives how many there are."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: unknown_plate, count: 2 }
    BadPlateIndex:
      description: "`bad_plate_index` — the path segment is not an integer."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: bad_plate_index }
    BadPlateParam:
      description: "`bad_param` with `param: plate` — the plate query value is not a non-negative integer."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: bad_param, param: plate }
    PlateResult:
      description: The plate after the operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Plate" }
    ProjectBlocked:
      description: |
        `busy_slicing`, or `project_dirty` when the project or presets have
        unsaved changes (carrying `model_dirty` and `presets_dirty`) and discard
        was not set.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PlateEmpty:
      description: "`empty` — the plate holds no objects."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: empty }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:  { type: string }
        detail: { type: string }

    Vec3:
      type: array
      items: { type: number }
      minItems: 3
      maxItems: 3

    Transform:
      type: object
      description: Instance 0 only. `rotation` is in radians.
      properties:
        offset:   { $ref: "#/components/schemas/Vec3" }
        rotation: { $ref: "#/components/schemas/Vec3" }
        scale:    { $ref: "#/components/schemas/Vec3" }

    ConfigWriteResult:
      type: object
      required: [applied, errors]
      properties:
        applied:
          type: array
          items: { type: string }
          description: Empty when the batch was rejected.
        errors:
          type: object
          additionalProperties: { type: string }
          description: Key to reason. Empty on success.

    PresetRef:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [print, filament, printer] }
        name: { type: string }

    PresetSelect:
      allOf:
        - $ref: "#/components/schemas/PresetRef"
        - type: object
          properties:
            slot:
              type: integer
              minimum: 1
              default: 1
              description: Filament only - the project filament slot, numbered from 1 as in the sidebar.

    PresetListItem:
      type: object
      properties:
        name:     { type: string }
        system:   { type: boolean }
        visible:  { type: boolean }
        selected: { type: boolean }

    HeightRange:
      type: object
      properties:
        min_z:        { type: number }
        max_z:        { type: number }
        layer_height: { type: number, description: 0.0 when the range carries no explicit height. }

    ObjectSummary:
      type: object
      properties:
        id:                   { type: integer, format: int64, description: The id the object sub-routes take. }
        index:                { type: integer }
        name:                 { type: string }
        size_mm:              { $ref: "#/components/schemas/Vec3" }
        instances:            { type: integer }
        transform:            { $ref: "#/components/schemas/Transform" }
        bbox_min:             { $ref: "#/components/schemas/Vec3" }
        bbox_max:             { $ref: "#/components/schemas/Vec3" }
        on_plate:             { type: boolean, description: The bounding box sits on the bed within 0.05 mm. }
        plate:                { type: integer, description: The plate instance 0 is on; -1 for none. }
        instance_plates:      { type: array, items: { type: integer }, description: The plate of each instance; -1 for none. }
        config:
          type: object
          additionalProperties: { type: string }
        custom_layer_profile: { type: boolean }
        height_ranges:        { type: array, items: { $ref: "#/components/schemas/HeightRange" } }

    Status:
      type: object
      properties:
        app:         { type: string }
        app_version: { type: string, description: "The bare upstream version, not the fork's display version." }
        api_version: { type: string }
        capabilities:
          type: array
          items: { type: string }
        project:     { type: string }
        current_plate: { type: integer }
        plate_count:   { type: integer }
        project_dirty: { type: boolean, description: The project has unsaved changes. }
        presets_dirty: { type: boolean, description: An edited preset has unsaved changes. }
        objects:
          type: array
          items:
            type: object
            properties:
              name:    { type: string }
              size_mm: { $ref: "#/components/schemas/Vec3" }
        presets:
          type: object
          properties:
            printer:   { type: string }
            print:     { type: string }
            filaments: { type: array, items: { type: string } }
        modified:
          type: object
          description: The dirty keys of each edited preset.
          properties:
            print:    { type: array, items: { type: string } }
            filament: { type: array, items: { type: string } }
            printer:  { type: array, items: { type: string } }
        slice_result_valid: { type: boolean }
        slicing:            { type: boolean }

    SliceWarning:
      type: object
      properties:
        level:   { type: integer }
        message: { type: string }
        code:    { type: string, description: "e.g. TOOLPATH_OUTSIDE for the synthetic plate-boundary warning." }

    RoleBreakdown:
      type: object
      properties:
        role:
          type: string
          enum: [outer_wall, inner_wall, sparse_infill, internal_solid_infill, top_surface,
                 gap_infill, bridge, overhang_perimeter, bottom_surface, ironing,
                 internal_bridge, skirt, brim, support, support_interface,
                 support_transition, wipe_tower, custom, mixed]
        time_s:   { type: number }
        time_pct: { type: number }
        flow_mm3_s:
          type: object
          properties:
            max:  { type: number }
            mean: { type: number }
        filament_mm: { type: number, description: Present only when the role consumed filament. }
        filament_g:  { type: number, description: Present only when the role consumed filament. }

    Breakdown:
      type: object
      properties:
        mode:         { type: string }
        total_time_s: { type: number }
        roles:        { type: array, items: { $ref: "#/components/schemas/RoleBreakdown" } }
        metrics:      { type: object }
        layers:       { type: array, items: { type: object } }

    SliceStats:
      type: object
      properties:
        estimated_time:         { type: string }
        filament_used_mm:       { type: number }
        filament_used_g:        { type: number }
        total_cost:             { type: number }
        estimated_time_seconds: { type: number }
        breakdown:              { $ref: "#/components/schemas/Breakdown" }

    SliceStatus:
      type: object
      required: [state, percent, message, warnings]
      properties:
        state:    { type: string, enum: [idle, slicing, done, error] }
        percent:  { type: integer, description: -1 when no slice is in progress. }
        message:  { type: string }
        plate:    { type: integer, description: The plate the slice ran on; -1 before any. }
        warnings: { type: array, items: { $ref: "#/components/schemas/SliceWarning" } }
        stats:    { $ref: "#/components/schemas/SliceStats" }
        breakdown:
          allOf:
            - $ref: "#/components/schemas/Breakdown"
          description: Mirrored at the top level as well as inside stats.

    SliceNotStarted:
      type: object
      required: [error, reason, message]
      properties:
        error:   { type: string, enum: [slice_not_started] }
        plate:   { type: integer }
        reason:  { type: string, enum: [outside, validation, invalid_state] }
        message: { type: string, description: The text the slicer's own notification shows. }
        opt_key: { type: string, description: The setting the validation names, when it names one. }
        object:  { type: string, description: The object the validation names, when it names one. }

    PlateObject:
      type: object
      properties:
        id:       { type: integer, format: int64 }
        name:     { type: string }
        instance: { type: integer }

    Plate:
      type: object
      properties:
        index:                    { type: integer }
        name:                     { type: string }
        current:                  { type: boolean }
        locked:                   { type: boolean, description: Skipped by arrange and orient. }
        empty:                    { type: boolean }
        printable:                { type: boolean }
        slice_result_valid:       { type: boolean }
        origin:                   { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
        bed:
          type: object
          description: The plate's bed in world coordinates.
          properties:
            min: { type: array, items: { type: number } }
            max: { type: array, items: { type: number } }
        bed_type:                 { type: string, description: A bed type name, or "default" to follow the global one. }
        effective_bed_type:       { type: string }
        print_sequence:           { type: string, enum: [default, "by layer", "by object"] }
        effective_print_sequence: { type: string, enum: ["by layer", "by object"] }
        first_layer_sequence:     { type: array, items: { type: integer }, description: 1-based filament numbers; empty for automatic. }
        spiral_mode:
          description: The plate's own setting, or "default" to follow the global one.
          oneOf:
            - { type: boolean }
            - { type: string, enum: [default] }
        effective_spiral_mode:    { type: boolean }
        objects:                  { type: array, items: { $ref: "#/components/schemas/PlateObject" } }

    PlateUpdate:
      type: object
      minProperties: 1
      properties:
        name:   { type: string }
        locked: { type: boolean }
        bed_type:
          type: string
          enum: [default, Cool Plate, Engineering Plate, High Temp Plate, Textured PEI Plate,
                 Textured Cool Plate, Supertack Plate]
        print_sequence: { type: string, enum: [default, "by layer", "by object"] }
        first_layer_sequence:
          type: array
          items: { type: integer, minimum: 1 }
        spiral_mode:
          oneOf:
            - { type: boolean }
            - { type: string, enum: [default] }
      example: { name: Clips, bed_type: Textured PEI Plate, print_sequence: by object }
